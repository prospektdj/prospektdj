name: Windows and Linux
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Windows ASIO SDK and LLVM
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-asio
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Linux container audio bridge regression
        if: runner.os == 'Linux'
        env:
          ALSA_CONFIG_PATH: ${{ github.workspace }}/tests/fixtures/alsa/broken-default.conf
          PROSPEKT_CONFIG_DIR: ${{ runner.temp }}/prospekt-audio-bridge-test
          PROSPEKT_TEST_BROKEN_ALSA: '1'
        run: cargo test --locked --test audio_backend -- --test-threads=1
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: Prospekt-DJ-${{ runner.os }}
          path: |
            target/release/prospekt-dj
            target/release/prospekt-dj.exe
            release-dist/ASIO-SDK-2.3.4-GPL3-source.zip
            README.md
            LICENSE
            licenses/
            docs/
