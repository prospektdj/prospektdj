name: Rust Windows and Linux
on:
  workflow_dispatch:
  push:
    tags: ['rust-v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: Prospekt-DJ-Rust-${{ runner.os }}
          path: |
            target/release/prospekt-dj
            target/release/prospekt-dj.exe
            README.md
            LICENSE
            licenses/
            docs/
