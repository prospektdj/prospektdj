name: Build and publish native packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/package_release.py'
      - 'scripts/package_deb.py'
permissions:
  contents: read
concurrency:
  group: native-release
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxkbcommon-dev libgl1-mesa-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package and verify archive
        run: python scripts/package_release.py --target ${{ matrix.target }} --platform ${{ matrix.platform }}
      - name: Build Debian installer
        if: runner.os == 'Linux'
        run: python scripts/package_deb.py --binary target/${{ matrix.target }}/release/prospekt-dj
      - name: Verify Debian installation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends ./release-dist/*.deb
          dpkg-query -W prospekt-dj
          test -x /usr/bin/prospekt-dj
          test -f /usr/share/applications/prospekt-dj.desktop
          ldd /usr/bin/prospekt-dj | tee /tmp/prospekt-libraries.txt
          ! grep -q 'not found' /tmp/prospekt-libraries.txt
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: |
            release-dist/*.zip
            release-dist/*.tar.gz
            release-dist/*.deb
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Checksums and release notes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import re
          version = re.search(r'^version = "([^"]+)"', Path('Cargo.toml').read_text(), re.M).group(1)
          assets = sorted(Path('release-assets').glob('*'))
          assert len(assets) == 3, f'Expected three native packages, got {len(assets)}'
          Path('release-assets/SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in assets))
          with open(__import__('os').environ['GITHUB_ENV'], 'a') as file:
              file.write(f'RELEASE_TAG=rust-v{version}\nRELEASE_VERSION={version}\n')
          PY
          cat > release-notes.md <<'NOTES'
          Natywna aplikacja Prospekt DJ napisana w Rust.

          - Windows x64: rozpakuj ZIP i uruchom prospekt-dj.exe.
          - Linux x64: rozpakuj tar.gz i uruchom ./prospekt-dj. Kompilacja na Ubuntu 22.04; wymagany pulpit, ALSA i OpenGL.
          - Debian/Ubuntu amd64: pobierz .deb i zainstaluj: sudo apt install ./prospekt-dj_2.1.0_amd64.deb. Pakiet dodaje program do menu aplikacji.

          Linux: Ubuntu 22.04+ / Debian 12+ (glibc 2.35+), wymagany pulpit. Windows: brak podpisu wydawcy. Testy automatyczne nie zastępują testów fizycznego kontrolera MIDI i interfejsu audio.

          WAV i AIFF działają bez dodatkowych kodeków. Dla pozostałych formatów nagrywania zainstaluj FFmpeg. Paczki zawierają dokumentację i licencje. Sumy kontrolne: SHA256SUMS.txt.
          NOTES
      - name: Publish release with all packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Prospekt DJ Rust $RELEASE_VERSION" --notes-file release-notes.md
