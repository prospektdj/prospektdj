name: Build and publish PRE-BETA packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/package_release.py'
      - 'scripts/package_deb.py'
      - 'scripts/package_appimage.sh'
      - 'scripts/package_flatpak.sh'
permissions:
  contents: read
concurrency:
  group: native-release
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev pkg-config flatpak xvfb libfuse2 file patchelf desktop-file-utils
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package and verify archive
        run: python scripts/package_release.py --target ${{ matrix.target }} --platform ${{ matrix.platform }}
      - name: Build Debian installer
        if: runner.os == 'Linux'
        run: python scripts/package_deb.py --binary target/${{ matrix.target }}/release/prospekt-dj
      - name: Verify Debian installation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends ./release-dist/*.deb
          dpkg-query -W prospekt-dj
          test -x /usr/bin/prospekt-dj
          test -f /usr/share/applications/prospekt-dj.desktop
          ldd /usr/bin/prospekt-dj | tee /tmp/prospekt-libraries.txt
          ! grep -q 'not found' /tmp/prospekt-libraries.txt
      - name: Build and verify AppImage
        if: runner.os == 'Linux'
        run: bash scripts/package_appimage.sh
      - name: Build and install Flatpak PRE-BETA
        if: runner.os == 'Linux'
        run: bash scripts/package_flatpak.sh
      - name: AppImage and Flatpak GUI smoke tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout 8s release-dist/*.AppImage --demo > appimage-smoke.log 2>&1
          appimage_result=$?
          xvfb-run -a timeout 8s flatpak run --env=LIBGL_ALWAYS_SOFTWARE=1 org.prospektdj.ProspektDJ --demo > flatpak-smoke.log 2>&1
          flatpak_result=$?
          echo "AppImage exit: $appimage_result; Flatpak exit: $flatpak_result"
          cat appimage-smoke.log flatpak-smoke.log
          test "$appimage_result" -eq 124 && test "$flatpak_result" -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: |
            release-dist/*.zip
            release-dist/*.tar.gz
            release-dist/*.deb
            release-dist/*.AppImage
            release-dist/*.flatpak
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Checksums and release notes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import re
          version = re.search(r'^version = "([^"]+)"', Path('Cargo.toml').read_text(), re.M).group(1)
          assets = sorted(Path('release-assets').glob('*'))
          assert len(assets) == 5, f'Expected five PRE-BETA packages, got {len(assets)}'
          screenshots = sorted(Path('docs/screenshots').glob('prebeta-*.png'))
          assert len(screenshots) == 4, 'Expected four current PRE-BETA screenshots'
          Path('release-assets/SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in assets + screenshots))
          with open(__import__('os').environ['GITHUB_ENV'], 'a') as file:
              file.write(f'RELEASE_TAG=rust-v{version}\nRELEASE_VERSION={version}\n')
          PY
          cat > release-notes.md <<'NOTES'
          **PRE-BETA — wersja testowa / pre-beta release.**

          Prospekt DJ Rust 2.3 PRE-BETA — compact DJ layout, larger animated jogs, spring pitch-bend faders, larger channel/crossfader controls, eight colored hot cues, nested crates, 3,846 offline color Twemoji icons, lazy folder tree, cover strip and verified online artwork.
          Online artwork is enabled by default. Only artist/album/title and public MusicBrainz IDs are sent to MusicBrainz / Cover Art Archive; no audio or private paths. Disable it in Settings.
          See docs/UPDATE-2.3.md for changes, validation and limitations.
          ![Current PRE-BETA build — two decks](https://raw.githubusercontent.com/prospektdj/prospektdj/rust-v2.3.0-prebeta.1/docs/screenshots/prebeta-main.png)
          ![Current PRE-BETA build — four decks](https://raw.githubusercontent.com/prospektdj/prospektdj/rust-v2.3.0-prebeta.1/docs/screenshots/prebeta-four-decks.png)

          Open source: AGPL-3.0-or-later. Proprietary Helvetica font is not bundled; select a licensed local file in settings.

          - Windows x64: rozpakuj ZIP i uruchom prospekt-dj.exe.
          - Linux x64: rozpakuj tar.gz i uruchom ./prospekt-dj. Kompilacja na Ubuntu 22.04; wymagany pulpit, ALSA i OpenGL.
          - AppImage: nadaj plikowi prawa wykonywania (chmod +x *.AppImage) i uruchom go.
          - Flatpak: flatpak install --user ./Prospekt-DJ-Rust-*.flatpak; uruchom: flatpak run org.prospektdj.ProspektDJ. Runtime pobierany jest z Flathub.
          - Debian/Ubuntu amd64: pobierz .deb i zainstaluj: sudo apt install ./prospekt-dj_*_amd64.deb. Pakiet dodaje program do menu aplikacji.

          Linux: Ubuntu 22.04+ / Debian 12+ (glibc 2.35+), wymagany pulpit. Windows: brak podpisu wydawcy. Testy automatyczne nie zastępują testów fizycznego kontrolera MIDI i interfejsu audio.

          WAV i AIFF działają bez dodatkowych kodeków. Dla pozostałych formatów nagrywania zainstaluj FFmpeg. Paczki zawierają dokumentację i licencje. Sumy kontrolne: SHA256SUMS.txt.
          NOTES
      - name: Publish release with all packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" release-assets/* docs/screenshots/prebeta-main.png docs/screenshots/prebeta-four-decks.png docs/screenshots/prebeta-small.png docs/screenshots/prebeta-emoji.png --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Prospekt DJ Rust $RELEASE_VERSION — PRE-BETA" --notes-file release-notes.md
