name: Build and publish PRE-BETA packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/package_release.py'
      - 'scripts/package_deb.py'
      - 'scripts/package_appimage.sh'
      - 'scripts/package_flatpak.sh'
permissions:
  contents: read
concurrency:
  group: native-release
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - name: Windows ASIO SDK and LLVM
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-asio
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev pkg-config flatpak xvfb libfuse2 file patchelf desktop-file-utils
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package and verify archive
        run: python scripts/package_release.py --target ${{ matrix.target }} --platform ${{ matrix.platform }}
      - name: Build Debian installer
        if: runner.os == 'Linux'
        run: python scripts/package_deb.py --binary target/${{ matrix.target }}/release/prospekt-dj
      - name: Verify Debian installation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends ./release-dist/*.deb
          dpkg-query -W prospekt-dj
          test -x /usr/bin/prospekt-dj
          test -f /usr/share/applications/prospekt-dj.desktop
          ldd /usr/bin/prospekt-dj | tee /tmp/prospekt-libraries.txt
          ! grep -q 'not found' /tmp/prospekt-libraries.txt
      - name: Build and verify AppImage
        if: runner.os == 'Linux'
        run: bash scripts/package_appimage.sh
      - name: Build and install Flatpak PRE-BETA
        if: runner.os == 'Linux'
        run: bash scripts/package_flatpak.sh
      - name: AppImage and Flatpak GUI smoke tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout 8s release-dist/*.AppImage --demo > appimage-smoke.log 2>&1
          appimage_result=$?
          xvfb-run -a timeout 8s flatpak run --env=LIBGL_ALWAYS_SOFTWARE=1 org.prospektdj.ProspektDJ --demo > flatpak-smoke.log 2>&1
          flatpak_result=$?
          echo "AppImage exit: $appimage_result; Flatpak exit: $flatpak_result"
          cat appimage-smoke.log flatpak-smoke.log
          test "$appimage_result" -eq 124 && test "$flatpak_result" -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: |
            release-dist/*.zip
            release-dist/*.tar.gz
            release-dist/*.deb
            release-dist/*.AppImage
            release-dist/*.flatpak
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Checksums and release notes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import re
          version = re.search(r'^version = "([^"]+)"', Path('Cargo.toml').read_text(), re.M).group(1)
          assets = sorted(Path('release-assets').glob('*'))
          assert len(assets) == 5, f'Expected five PRE-BETA packages, got {len(assets)}'
          import shutil
          screenshots = sorted(Path('docs/next-update/screenshots').glob('v24-*.png'))
          assert len(screenshots) == 6, 'Expected six current 2.4 PRE-BETA screenshots'
          for screenshot in screenshots:
              shutil.copy2(screenshot, Path('release-assets') / screenshot.name)
          shutil.copy2('docs/next-update/screenshots/build-info.json', 'release-assets/v24-screenshot-build-info.json')
          assets = sorted(Path('release-assets').glob('*'))
          Path('release-assets/SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in assets))
          notes = Path('docs/RELEASE-2.4.md').read_text().replace('{{TAG}}', f'rust-v{version}').replace('{{VERSION}}', version)
          Path('release-notes.md').write_text(notes)
          with open(__import__('os').environ['GITHUB_ENV'], 'a') as file:
              file.write(f'RELEASE_TAG=rust-v{version}\nRELEASE_VERSION={version}\n')
          PY
      - name: Publish release with all packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Prospekt DJ Rust $RELEASE_VERSION — PRE-BETA" --notes-file release-notes.md
