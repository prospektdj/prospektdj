[package]
name = "prospekt-dj"
version = "2.4.1-prebeta.1"
edition = "2021"
rust-version = "1.89"
description = "PRE-BETA open source DJ studio for Windows and Linux"
license = "AGPL-3.0-or-later"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
unicode-normalization = "0.1"
unicode-segmentation = "1"
roxmltree = "0.20"
arabic_reshaper = "0.4"
unicode-bidi = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
ttf-parser = "0.25"
anyhow = "1"
cpal = "0.17.3"
crossbeam-channel = "0.5"
directories = "6"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11"] }
egui = "0.31.1"
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
lofty = "0.22"
midir = "0.11"
rand = "0.9"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5.4", features = ["all"] }
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
csv = "1"
url = "2"

[target.'cfg(target_os = "windows")'.dependencies]
cpal = { version = "0.17.3", features = ["asio"] }
asio-sys = "0.2.6"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
