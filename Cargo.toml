[package]
name = "prospekt-dj"
version = "2.2.0-beta.1"
edition = "2021"
rust-version = "1.89"
description = "BETA open source DJ studio for Windows and Linux"
license = "AGPL-3.0-or-later"

[dependencies]
roxmltree = "0.20"
arabic_reshaper = "0.4"
unicode-bidi = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
ttf-parser = "0.25"
anyhow = "1"
cpal = "0.15.3"
crossbeam-channel = "0.5"
directories = "6"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11"] }
egui = "0.31.1"
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
lofty = "0.22"
midir = "0.10"
rand = "0.9"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5.4", features = ["all"] }
walkdir = "2"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
